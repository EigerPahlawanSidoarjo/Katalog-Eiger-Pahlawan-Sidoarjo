
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Katalog Eiger Pahlawan Sidoarjo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f4f4f4;
    }
    h1 { color: #24402d; }
    #produk {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }
    .kartu {
      background: white;
      padding: 12px;
      border-radius: 10px;
    }
    .kartu img {
      width: 100%;
      height: 180px;
      object-fit: contain;
    }
    .harga { font-weight: bold; color: #e66b19; }
 
.modal{position:fixed;inset:0;z-index:1000;background:#07110dcc;display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modal-panel{background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:18px;width:min(680px,100%);max-height:88vh;overflow:auto;box-shadow:0 24px 80px #0005}
.modal-head{display:flex;justify-content:space-between;align-items:start;gap:12px;padding:20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:20px;margin:5px 0}
.modal-close{border:1px solid var(--line);background:var(--canvas);color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer}
.modal-content{padding:18px 20px 22px}
.variant-table{width:100%;border-collapse:collapse;font-size:13px}
.variant-table th,.variant-table td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line)}
.variant-table th{color:var(--muted);font-size:11px;text-transform:uppercase}
.stock-ok{color:#16834a;font-weight:800}
.stock-empty{color:#d64b35;font-weight:800}
.variant-color{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 9px}
.detail-btn{width:100%;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--canvas);color:var(--ink);font-weight:750;cursor:pointer}
@media(max-width:480px){.modal{padding:10px}.modal-head,.modal-content{padding-left:14px;padding-right:14px}.variant-table th,.variant-table td{padding:9px 5px;font-size:12px}}
 </style>
</head>
<body>

  <h1>EIGER PAHLAWAN SIDOARJO</h1>
  <p id="status">Memuat katalog produk...</p>
  <div id="produk"></div>

  <script>
    
const CSV_URLS = [
  'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCSr2YTeykLQhmY8-z0d6VxGcXjIZSvCVAA-BReoCIdmZLZeAaaNa5V8w3pYfR09EHGrAQLFJ_7XYg/pub?gid=1076500592&single=true&output=csv',
  'https://docs.google.com/spreadsheets/d/e/2PACX-1vRCSr2YTeykLQhmY8-z0d6VxGcXjIZSvCVAA-BReoCIdmZLZeAaaNa5V8w3pYfR09EHGrAQLFJ_7XYg/pub?output=csv&gid=1076500592'
];

    async function tampilkanProduk() {
      const status = document.getElementById("status");
      const area = document.getElementById("produk");

      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error("Data tidak dapat diakses");

        const csv = await response.text();
        const baris = csv.trim().split(/\r?\n/);

        // Memecah CSV sederhana; cocok untuk data
        // yang tidak memiliki koma di dalam kolom.
        const header = baris[0].split(",")
          .map(x => x.replace(/^\uFEFF/, "").trim().toUpperCase());

        const kolom = nama => header.indexOf(nama);

        const idxNama = kolom("NAMA PRODUK");
        const idxHarga = kolom("HARGA PROMO");
        const idxFoto = kolom("FOTO PRODUK");
        const idxStok = kolom("AVAILABLE QTY");

        if (idxNama < 0) {
          throw new Error("Kolom NAMA PRODUK tidak ditemukan");
        }

        area.innerHTML = "";

        baris.slice(1).forEach(line => {
          const data = line.split(",");
          const nama = data[idxNama] || "";
          if (!nama.trim()) return;

          const harga = data[idxHarga] || "0";
          const foto = data[idxFoto] || "";
          const stok = data[idxStok] || "0";

          const kartu = document.createElement("div");
          kartu.className = "kartu";

          const gambar = document.createElement("img");
          gambar.src = foto;
          gambar.alt = nama;
          gambar.onerror = () => gambar.remove();

          const judul = document.createElement("h3");
          judul.textContent = nama;

          const hargaTeks = document.createElement("p");
          hargaTeks.className = "harga";
          hargaTeks.textContent = "Rp" +
            Number(harga.replace(/[^\d]/g, "") || 0)
              .toLocaleString("id-ID");

          const stokTeks = document.createElement("p");
          stokTeks.textContent = "Stok: " + stok;

          kartu.append(gambar, judul, hargaTeks, stokTeks);
          area.appendChild(kartu);
        });

        status.textContent = "Produk berhasil dimuat: " +
          area.children.length;

      } catch (error) {
        status.textContent = "Gagal memuat katalog: " + error.message;
      }
    }

    tampilkanProduk();
  </script>
</body>
</html>
